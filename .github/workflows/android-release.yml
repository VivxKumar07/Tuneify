name: Tuneify Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    name: Build Tuneify Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APKs
        run: ./gradlew assembleArm64GmsRelease assembleUniversalGmsRelease

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tuneify-Release-APKs
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 30
